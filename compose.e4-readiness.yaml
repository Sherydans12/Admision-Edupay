services:
  postgres:
    ports: !reset []

  migrator:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.migrator
      args:
        IMAGE_READINESS: DEVELOPMENT READINESS IMAGE
    environment:
      DATABASE_MIGRATION_URL: postgresql://admission_migrator:admission_migrator_local_only@postgres:5432/admission_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        IMAGE_READINESS: DEVELOPMENT READINESS IMAGE
        RUNTIME_NODE_ENV: development
    environment:
      DATABASE_APP_URL: postgresql://admission_app:admission_app_local_only@postgres:5432/admission_dev
      DOCUMENT_STORAGE_LOCAL_ROOT: /app/document-storage
      DOCUMENT_UPLOAD_HARD_MAX_BYTES: "10485760"
      PORT: "3001"
    ports:
      - "127.0.0.1:${E4_API_PORT:-3301}:3001"
    depends_on:
      migrator:
        condition: service_completed_successfully
    volumes:
      - e5c-document-storage:/app/document-storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/health/ready').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        IMAGE_READINESS: DEVELOPMENT READINESS IMAGE
        RUNTIME_NODE_ENV: development
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${E4_WEB_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        IMAGE_READINESS: DEVELOPMENT READINESS IMAGE
        RUNTIME_NODE_ENV: development
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_APP_URL: postgresql://admission_app:admission_app_local_only@postgres:5432/admission_dev
      DOCUMENT_STORAGE_LOCAL_ROOT: /app/document-storage
      DOCUMENT_UPLOAD_HARD_MAX_BYTES: "10485760"
      DOCUMENT_WORKER_POLL_MS: "250"
      OUTBOX_LEASE_MS: "60000"
      DOCUMENT_JOB_MAX_ATTEMPTS: "5"
      DOCUMENT_JOB_BASE_BACKOFF_MS: "1000"
    init: true
    volumes:
      - e5c-document-storage:/app/document-storage

volumes:
  e5c-document-storage:
