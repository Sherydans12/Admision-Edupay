name: Deploy synthetic preproduction to Coolify

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREPROD_SYNTHETIC to confirm the synthetic-only deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-preprod-coolify
  cancel-in-progress: false

jobs:
  validate-deployment:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'PREPROD_SYNTHETIC'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      - name: Validate Coolify deployment contract
        run: node scripts/g5coolify-config-smoke.mjs

  deploy:
    needs: validate-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: admission-preprod
    steps:
      - name: Require scoped Coolify deployment secrets
        # COOLIFY_DEPLOY_TOKEN requires Coolify permissions: read + deploy.
        # read:sensitive and root are intentionally not required.
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_BASE_URL: ${{ secrets.COOLIFY_API_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$COOLIFY_DEPLOY_TOKEN"
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_BASE_URL"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

      - name: Validate effective Coolify endpoint shape
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_BASE_URL: ${{ secrets.COOLIFY_API_BASE_URL }}
        run: |
          python3 <<'PY'
          import os
          import sys
          from urllib.parse import parse_qs, urlsplit

          webhook = urlsplit(os.environ["COOLIFY_DEPLOY_WEBHOOK"])
          api = urlsplit(os.environ["COOLIFY_API_BASE_URL"])

          print(f"Coolify API endpoint: scheme={api.scheme} host={api.hostname} path={api.path}")
          print(
              "Coolify webhook endpoint: "
              f"scheme={webhook.scheme} host={webhook.hostname} "
              f"path={webhook.path} query_keys={sorted(parse_qs(webhook.query))}"
          )

          if api.scheme != "https" or api.path.rstrip("/") != "/api/v1":
              print("Invalid COOLIFY_API_BASE_URL shape", file=sys.stderr)
              sys.exit(1)
          if webhook.scheme != "https" or webhook.path.rstrip("/") != "/api/v1/deploy":
              print("Invalid COOLIFY_DEPLOY_WEBHOOK path", file=sys.stderr)
              sys.exit(1)
          if "uuid" not in parse_qs(webhook.query):
              print("COOLIFY_DEPLOY_WEBHOOK must include uuid", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Request Coolify deployment
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          response="$RUNNER_TEMP/coolify-deploy.json"
          http_code=$(curl --silent --show-error --max-time 30 \
            --proto '=https' --tlsv1.2 \
            --output "$response" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${COOLIFY_DEPLOY_WEBHOOK}")
          if [[ "$http_code" != 2* ]]; then
            echo "Coolify deploy request returned HTTP ${http_code}" >&2
            echo "Response body (secrets must not be included):" >&2
            sed -E 's/(Bearer|CF-Access-Client-Secret|CF-Access-Client-Id)[^, ]*/\1=<redacted>/g' "$response" >&2
            exit 1
          fi
          jq -e '.deployments | length > 0 and all(.[]; (.deployment_uuid | type == "string" and length > 0))' "$response" >/dev/null

      - name: Wait for the requested Coolify revision
        env:
          COOLIFY_API_BASE_URL: ${{ secrets.COOLIFY_API_BASE_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          response="$RUNNER_TEMP/coolify-deploy.json"
          mapfile -t deployment_ids < <(jq -r '.deployments[].deployment_uuid' "$response")
          completed=false
          for attempt in $(seq 1 90); do
            completed=true
            for deployment_id in "${deployment_ids[@]}"; do
              payload=$(curl --fail --silent --show-error --max-time 15 \
                --proto '=https' --tlsv1.2 \
                --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
                --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
                --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
                "${COOLIFY_API_BASE_URL%/}/deployments/${deployment_id}")
              status=$(jq -r '.status' <<<"$payload")
              case "$status" in
                finished)
                  test "$(jq -r '.commit' <<<"$payload")" = "$GITHUB_SHA"
                  ;;
                failed|cancelled|cancelled-by-user)
                  echo "Coolify deployment ${deployment_id} ended with ${status}" >&2
                  exit 1
                  ;;
                *)
                  completed=false
                  ;;
              esac
            done
            if [ "$completed" = true ]; then break; fi
            sleep 10
          done
          test "$completed" = true

      - name: Verify public preproduction health
        env:
          PREPROD_API_HEALTH_URL: ${{ vars.PREPROD_API_HEALTH_URL }}
          PREPROD_WEB_HEALTH_URL: ${{ vars.PREPROD_WEB_HEALTH_URL }}
        run: |
          test -n "$PREPROD_API_HEALTH_URL"
          test -n "$PREPROD_WEB_HEALTH_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 --output /dev/null "$PREPROD_API_HEALTH_URL" && \
               curl --fail --silent --show-error --max-time 10 --output /dev/null "$PREPROD_WEB_HEALTH_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Synthetic preproduction did not become healthy in time" >&2
          exit 1
