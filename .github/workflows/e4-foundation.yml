name: E4 foundation

on:
  pull_request:
  push:
    branches:
      - feat/e4-technical-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.14-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: admission_bootstrap_local_only
          POSTGRES_USER: admission_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admission_bootstrap -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_APP_URL: postgresql://admission_app:admission_app_local_only@localhost:5432/admission_dev
      DATABASE_MIGRATION_URL: postgresql://admission_migrator:admission_migrator_local_only@localhost:5432/admission_dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap local database roles
        env:
          PGPASSWORD: admission_bootstrap_local_only
        run: >-
          docker run --rm --network host
          -v "$PWD/infrastructure/postgres/init/001-bootstrap.sql:/bootstrap.sql:ro"
          -e PGPASSWORD
          postgres:15.14-alpine
          psql -h localhost -U admission_bootstrap -d postgres -f /bootstrap.sql

      - name: Generate Prisma Client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate

      - name: Validate foundation
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Scan repository for high-confidence secrets
        run: pnpm security:secrets

      - name: Audit dependencies
        run: pnpm security:deps

      - name: Prove tenant isolation with PostgreSQL RLS
        run: pnpm test:rls

      - name: Prepare isolated E5-F migration smoke database
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres

      - name: Prove E5-F fresh and incremental migration upgrade
        run: pnpm e5f:migration:smoke

      - name: Prove E5-G fresh and incremental migration upgrade
        run: pnpm e5g:migration:smoke

      - name: Prove E5-H fresh and incremental migration upgrade
        run: pnpm e5h:migration:smoke

      - name: Prove E5-I fresh and incremental migration upgrade
        run: pnpm e5i:migration:smoke

      - name: Verify E5-I has no executable external integration
        run: pnpm e5i:boundary:check

      - name: Prove G5-BR fresh and incremental migration upgrade
        run: pnpm g5br:migration:smoke

      - name: Prove G5-PC1-R12 fresh and incremental Migration 17 upgrade
        run: pnpm g5pc1r12:migration:smoke

      - name: Prove G5-PC1-R4 fresh and incremental Migration 18 upgrade
        run: pnpm g5pc1r4:migration:smoke

      - name: Prove G5-PC1-R3 fresh and incremental Migration 19 upgrade
        run: pnpm g5pc1r3:migration:smoke

      - name: Prove G5-PC1-R5 fresh and incremental Migration 20 upgrade
        run: pnpm g5pc1r5:migration:smoke

      - name: Prove G5-OR operational readiness
        run: pnpm g5or:operations:smoke

      - name: Prove G5-OR coordinated synthetic recovery
        run: pnpm g5or:recovery:smoke

      - name: Remove isolated migration smoke database
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env
